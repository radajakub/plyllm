[project]
name = "plyllm"
# set by `make release VERSION=X.Y.Z`; the first release is 1.0.0
version = "0.0.0"
description = "One interface to many LLM providers and models: generation, structured output, embeddings, costs, retries and rate limits."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakub Rada", email = "radajak5@fel.cvut.cz" }]
keywords = [
    "llm",
    "large-language-models",
    "ai",
    "openai",
    "gemini",
    "anthropic",
    "claude",
    "mistral",
    "grok",
    "embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# majors capped at the versions the live tests ran on; lift them in a separate change, with a live run
openai = ["openai>=2.48.0,<3"]
gemini = ["google-genai>=2.14.0,<3"]
grok = ["openai>=2.48.0,<3"]
anthropic = ["anthropic>=0.120.2,<1"]
mistral = ["mistralai>=2.9.1,<3"]
# metacentrum is an OpenAI-compatible endpoint and reuses the openai SDK
metacentrum = ["openai>=2.48.0,<3"]
huggingface = ["torch>=2.4.0", "transformers>=4.44.0"]
all = ["openai>=2.48.0,<3", "google-genai>=2.14.0,<3", "anthropic>=0.120.2,<1", "mistralai>=2.9.1,<3", "torch>=2.4.0", "transformers>=4.44.0"]

[project.urls]
Repository = "https://github.com/radajakub/plyllm"
Issues = "https://github.com/radajakub/plyllm/issues"
Changelog = "https://github.com/radajakub/plyllm/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plyllm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "online: free calls that need network and the API keys; skipped unless pytest runs with --online (make test-models)",
    "live: real, paid API calls; skipped unless pytest runs with --live (make test-live)",
]

[tool.ruff]
line-length = 180
target-version = "py312"

[tool.ruff.lint]
# Minimal set: pyflakes (F), essential pycodestyle errors (E4/E7/E9), import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "pyright>=1.1.414",
    # provider SDKs are optional extras; include the API-based ones so the test suite runs
    "openai>=2.48.0,<3",
    "google-genai>=2.14.0,<3",
    "anthropic>=0.120.2,<1",
    "mistralai>=2.9.1,<3",
]
